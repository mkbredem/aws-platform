---
# =============================================================================
# satellite_cert_rotate - entry point
#
# UNSUPPORTED CONTENT. An illustration of what this automation could look like.
# Not a Red Hat product. Not supported by Red Hat, any Red Hat employee, or the
# author. Not validated against all environments. Run at your own risk.
# See README.md.
# =============================================================================

- name: Display the unsupported-content and downtime notice
  ansible.builtin.debug:
    msg:
      - "satellite_cert_rotate is UNSUPPORTED content: an illustration of what"
      - "this automation could look like. It is not a Red Hat product, is not"
      - "supported by Red Hat, any Red Hat employee, or its author, and has not"
      - "been validated against every Satellite version or topology."
      - "Whoever runs it does so at their own risk."
      - "satellite-installer restarts Satellite services (httpd, foreman,"
      - "dynflow, pulpcore and others). Expect the web UI, content delivery,"
      - "and remote execution to be unavailable while it runs, commonly 10-30"
      - "minutes per server."
      - "Run this from a workstation or an Ansible Automation Platform cluster"
      - "that does not depend on the Satellite being rotated."
      - "Component: {{ satellite_cert_rotate_component }} on {{ inventory_hostname }}"
      - "Satellite version: {{ satellite_cert_rotate_version }}"
  run_once: true

- name: Run preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Skip a host that already serves this certificate
  when: satellite_cert_rotate_already_current | bool
  block:
    - name: Report that the certificate is already deployed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} already serves the certificate with serial
          {{ satellite_cert_rotate_new_serial }}. Nothing to do. Set
          satellite_cert_rotate_skip_if_current=false to force a redeployment,
          which restarts services.

    - name: End the play for this host
      ansible.builtin.meta: end_host

- name: Rotate the Satellite Server certificate
  ansible.builtin.include_tasks: satellite.yml
  when: satellite_cert_rotate_component == 'satellite'

- name: Rotate the Capsule Server certificate
  ansible.builtin.include_tasks: capsule.yml
  when: satellite_cert_rotate_component == 'capsule'

- name: Verify the certificate now served
  ansible.builtin.include_tasks: verify.yml
  when:
    - satellite_cert_rotate_verify | bool
    - not (satellite_cert_rotate_validate_only | bool)
